name: restore-docker-latest

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: Stable image tag to promote back to latest (for example v2.0.17)
        required: true
        type: string
      confirmation:
        description: Type RESTORE LATEST to confirm the registry change
        required: true
        type: string

permissions:
  contents: read

env:
  DOCKERHUB_REPOSITORY: platec/roud

concurrency:
  group: docker-latest-restore
  cancel-in-progress: false

jobs:
  restore:
    name: Restore latest from a stable tag
    runs-on: ubuntu-latest

    steps:
      - name: Validate request
        env:
          SOURCE_TAG: ${{ inputs.source_tag }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          if [[ "$CONFIRMATION" != "RESTORE LATEST" ]]; then
            echo "The confirmation text is invalid." >&2
            exit 1
          fi
          if [[ ! "$SOURCE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "source_tag must be a stable version tag such as v2.0.17." >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Restore latest
        env:
          SOURCE_TAG: ${{ inputs.source_tag }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "$DOCKERHUB_REPOSITORY:latest" \
            "$DOCKERHUB_REPOSITORY:$SOURCE_TAG"
          docker buildx imagetools inspect "$DOCKERHUB_REPOSITORY:latest"
