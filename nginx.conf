server {
  server_name localhost;
  listen      80;
  root        /usr/share/nginx/html;
  index       index.html index.htm;
  absolute_redirect off;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~ ^/assets/(.*) {
    return 301 /$1;
  }

  # Development configuration must never be served by a production image.
  location = /config.dev.json {
    return 404;
  }

  location = /config/config.dev.json {
    return 404;
  }

  location ~ ^/config/(.*) {
    return 301 /$1;
  }
}
